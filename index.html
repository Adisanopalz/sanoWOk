<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile-first viewport & Safe Area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IRONPULSE - Premium Fitness Tracker</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Brand Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        app: {
                            bg: '#0A0A0A',
                            surface: '#151515',
                            surface2: '#202020',
                            accent: '#C5FF4A',
                            border: '#292929',
                            text: '#FFFFFF',
                            textMuted: '#A1A1AA'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Utilities */
        body {
            background-color: #000; /* Outer background for desktop */
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Mobile layout container constraint for desktop viewing */
        .mobile-container {
            max-width: 430px; /* Max iPhone width */
            margin: 0 auto;
            background-color: #0A0A0A;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            border-left: 1px solid #1A1A1A;
            border-right: 1px solid #1A1A1A;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Safe area paddings */
        .pt-safe { padding-top: max(1rem, env(safe-area-inset-top)); }
        .pb-safe { padding-bottom: max(5rem, env(safe-area-inset-bottom, 5rem)); }
        
        /* Input overrides */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .glass-nav {
            background: rgba(21, 21, 21, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="antialiased selection:bg-app-accent selection:text-black">

    <!-- App Container -->
    <div id="app" class="mobile-container">
        <!-- Dynamic Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pt-safe pb-32 px-4 hide-scrollbar"></main>

        <!-- Tracker Overlay (Hidden by default) -->
        <div id="tracker-overlay" class="fixed inset-0 z-50 bg-app-bg flex flex-col hidden transform transition-transform">
            <!-- Rendered by JS -->
        </div>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 glass-nav border-t border-app-border z-40 pb-[env(safe-area-inset-bottom)]">
            <div class="flex justify-around items-center h-20 px-2 relative">
                <button onclick="navigate('home')" class="nav-btn flex flex-col items-center justify-center w-16 h-full gap-1 text-app-textMuted transition-colors" data-tab="home">
                    <i data-lucide="home" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                <button onclick="navigate('library')" class="nav-btn flex flex-col items-center justify-center w-16 h-full gap-1 text-app-textMuted transition-colors" data-tab="library">
                    <i data-lucide="search" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Library</span>
                </button>
                
                <!-- Main Action Button -->
                <button onclick="startWorkout()" class="relative -top-5 flex flex-col items-center justify-center group active:scale-95 transition-transform">
                    <div class="w-14 h-14 rounded-full bg-app-accent flex items-center justify-center shadow-[0_4px_20px_rgba(197,255,74,0.4)]">
                        <i data-lucide="dumbbell" class="w-7 h-7 text-black"></i>
                    </div>
                </button>

                <button onclick="navigate('programs')" class="nav-btn flex flex-col items-center justify-center w-16 h-full gap-1 text-app-textMuted transition-colors" data-tab="programs">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Programs</span>
                </button>
                <button onclick="navigate('profile')" class="nav-btn flex flex-col items-center justify-center w-16 h-full gap-1 text-app-textMuted transition-colors" data-tab="profile">
                    <i data-lucide="user" class="w-6 h-6"></i>
                    <span class="text-[10px] font-medium">Profile</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <script>
        // --- DATA ---
        const EXERCISES = [
            { id: 'e1', name: 'Barbell Bench Press', muscle: 'Chest', equipment: 'Barbell' },
            { id: 'e2', name: 'Incline Dumbbell Press', muscle: 'Chest', equipment: 'Dumbbell' },
            { id: 'e3', name: 'Pull Up', muscle: 'Back', equipment: 'Bodyweight' },
            { id: 'e4', name: 'Barbell Row', muscle: 'Back', equipment: 'Barbell' },
            { id: 'e5', name: 'Overhead Press', muscle: 'Shoulders', equipment: 'Barbell' },
            { id: 'e6', name: 'Lateral Raise', muscle: 'Shoulders', equipment: 'Dumbbell' },
            { id: 'e7', name: 'Barbell Curl', muscle: 'Arms', equipment: 'Barbell' },
            { id: 'e8', name: 'Tricep Pushdown', muscle: 'Arms', equipment: 'Cable' },
            { id: 'e9', name: 'Squat', muscle: 'Legs', equipment: 'Barbell' },
            { id: 'e10', name: 'Romanian Deadlift', muscle: 'Legs', equipment: 'Barbell' },
            { id: 'e11', name: 'Crunch', muscle: 'Abs', equipment: 'Bodyweight' },
        ];

        const PROGRAMS = [
            { id: 'p1', name: 'Push Pull Legs (PPL)', level: 'Intermediate', days: 6, desc: 'Classic 6-day split for maximum hypertrophy.' },
            { id: 'p2', name: 'Full Body Fundamentals', level: 'Beginner', days: 3, desc: 'Perfect starting point for building overall strength.' },
            { id: 'p3', name: 'Upper/Lower Split', level: 'Intermediate', days: 4, desc: 'Balanced approach for strength and size.' },
        ];

        // --- STATE ---
        let state = {
            currentView: 'home',
            history: JSON.parse(localStorage.getItem('ironpulse_history') || '[]'),
            activeWorkout: null, // { startTime, duration, exercises: [] }
            timerInterval: null
        };

        // --- UTILS ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const saveHistory = () => {
            localStorage.setItem('ironpulse_history', JSON.stringify(state.history));
        };

        // --- RENDER ENGINE ---
        const DOM = {
            main: document.getElementById('main-content'),
            tracker: document.getElementById('tracker-overlay'),
            nav: document.getElementById('bottom-nav'),
            modals: document.getElementById('modal-container')
        };

        function navigate(view) {
            if(state.activeWorkout && view !== 'tracker') {
                if(!confirm("A workout is active. Return to it?")) return;
                showTracker();
                return;
            }
            state.currentView = view;
            updateNavUI();
            renderCurrentView();
        }

        function updateNavUI() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                const text = btn.querySelector('span');
                if (btn.dataset.tab === state.currentView) {
                    btn.classList.add('text-app-accent');
                    btn.classList.remove('text-app-textMuted');
                } else {
                    btn.classList.remove('text-app-accent');
                    btn.classList.add('text-app-textMuted');
                }
            });
        }

        function renderCurrentView() {
            let html = '';
            switch(state.currentView) {
                case 'home': html = getHomeHTML(); break;
                case 'library': html = getLibraryHTML(); break;
                case 'programs': html = getProgramsHTML(); break;
                case 'profile': html = getProfileHTML(); break;
            }
            DOM.main.innerHTML = `<div class="animate-fade-in">${html}</div>`;
            lucide.createIcons();
        }

        // --- VIEWS ---
        function getHomeHTML() {
            const recent = state.history.length > 0 ? state.history[state.history.length - 1] : null;
            const streak = state.history.length > 0 ? '3' : '0'; // Mock streak

            let recentHTML = recent ? `
                <div class="bg-app-surface border border-app-border rounded-2xl p-4 flex items-center justify-between cursor-pointer active:scale-95 transition-transform" onclick="navigate('profile')">
                    <div>
                        <h4 class="font-bold text-white text-sm">Freestyle Workout</h4>
                        <p class="text-xs text-app-textMuted mt-1 flex items-center gap-1">
                            <i data-lucide="clock" class="w-3 h-3"></i> ${formatTime(recent.duration)} • ${recent.exercises.length} Exercises
                        </p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-app-textMuted"></i>
                </div>
            ` : `
                <div class="bg-app-surface border border-app-border rounded-2xl p-8 text-center">
                    <i data-lucide="history" class="w-8 h-8 text-app-textMuted mx-auto mb-2 opacity-50"></i>
                    <p class="text-sm text-app-textMuted">No recent workouts.</p>
                </div>
            `;

            return `
                <header class="flex justify-between items-center mb-6 pt-2">
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">Ready to crush it?</h1>
                        <p class="text-app-textMuted text-sm">Let's get back to work.</p>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-app-surface2 to-app-surface border border-app-border flex items-center justify-center">
                        <i data-lucide="user" class="text-app-textMuted w-6 h-6"></i>
                    </div>
                </header>

                <!-- Quick Start -->
                <div class="bg-app-surface border border-app-border rounded-2xl p-5 mb-6 relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 opacity-[0.03] text-white">
                        <i data-lucide="activity" class="w-32 h-32"></i>
                    </div>
                    <div class="relative z-10">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-white/10 text-white mb-3 inline-block">Quick Start</span>
                        <h2 class="text-xl font-bold text-white mb-1">Freestyle Session</h2>
                        <p class="text-app-textMuted text-sm mb-5">Start an empty workout and track as you go.</p>
                        <button onclick="startWorkout()" class="w-full bg-app-accent text-black font-bold py-3 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-[0_0_20px_rgba(197,255,74,0.2)]">
                            <i data-lucide="play" class="w-4 h-4 fill-black"></i> Start Workout
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-app-surface border border-app-border rounded-2xl p-4 flex flex-col items-center justify-center">
                        <i data-lucide="flame" class="w-6 h-6 text-app-accent mb-2"></i>
                        <span class="text-2xl font-black text-white">${streak}</span>
                        <span class="text-[10px] text-app-textMuted uppercase tracking-wider font-bold">Day Streak</span>
                    </div>
                    <div class="bg-app-surface border border-app-border rounded-2xl p-4 flex flex-col items-center justify-center">
                        <i data-lucide="trophy" class="w-6 h-6 text-app-accent mb-2"></i>
                        <span class="text-2xl font-black text-white">${state.history.length}</span>
                        <span class="text-[10px] text-app-textMuted uppercase tracking-wider font-bold">Workouts</span>
                    </div>
                </div>

                <h3 class="text-lg font-bold text-white mb-3">Recent Activity</h3>
                ${recentHTML}
            `;
        }

        function getLibraryHTML() {
            let listHTML = EXERCISES.map(ex => `
                <div class="bg-app-surface border border-app-border rounded-xl p-3 flex items-center justify-between mb-3">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-lg bg-app-surface2 flex items-center justify-center">
                            <i data-lucide="dumbbell" class="w-6 h-6 text-app-textMuted"></i>
                        </div>
                        <div>
                            <h3 class="text-white font-bold text-sm">${ex.name}</h3>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded flex items-center bg-app-surface2 text-app-textMuted">${ex.muscle}</span>
                            </div>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-app-textMuted"></i>
                </div>
            `).join('');

            return `
                <h1 class="text-2xl font-bold text-white mb-6">Exercises</h1>
                <div class="relative mb-6">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-app-textMuted"></i>
                    <input type="text" placeholder="Search exercises..." class="w-full bg-app-surface border border-app-border rounded-xl py-3 pl-10 pr-4 text-white text-sm focus:outline-none focus:border-app-accent transition-colors" readonly onclick="alert('Search functionality mocked for single file demo.')">
                </div>
                <div>${listHTML}</div>
            `;
        }

        function getProgramsHTML() {
            let html = PROGRAMS.map(p => `
                <div class="bg-app-surface border border-app-border rounded-2xl p-5 mb-4 relative overflow-hidden group">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-white mb-1">${p.name}</h3>
                            <div class="flex gap-2">
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-app-surface2 text-app-textMuted">${p.level}</span>
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md bg-[#1A1A1A] text-app-textMuted">${p.days} Days/Wk</span>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-app-surface2 flex items-center justify-center">
                           <i data-lucide="chevron-right" class="w-4 h-4 text-app-textMuted"></i>
                        </div>
                    </div>
                    <p class="text-app-textMuted text-sm mb-4 line-clamp-2">${p.desc}</p>
                    <div class="w-full bg-app-surface2 h-1 rounded-full overflow-hidden">
                        <div class="bg-app-accent h-full w-[10%] opacity-50"></div>
                    </div>
                </div>
            `).join('');

            return `
                <h1 class="text-2xl font-bold text-white mb-6">Programs</h1>
                ${html}
            `;
        }

        function getProfileHTML() {
            const totalDuration = state.history.reduce((acc, curr) => acc + curr.duration, 0);
            const totalExercises = state.history.reduce((acc, curr) => acc + curr.exercises.length, 0);
            
            let historyHTML = state.history.slice().reverse().map(session => `
                <div class="bg-app-surface border border-app-border rounded-xl p-4 mb-3">
                    <div class="flex justify-between items-center border-b border-app-border pb-3 mb-3">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-app-accent text-black">
                                <i data-lucide="activity" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-sm">Freestyle Workout</h4>
                                <p class="text-[11px] text-app-textMuted">${new Date(session.date).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="text-right text-sm font-mono text-white">
                            ${formatTime(session.duration)}
                        </div>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        ${session.exercises.map(ex => {
                            const completedSets = ex.sets.filter(s => s.completed).length;
                            if(completedSets === 0) return '';
                            return `<span class="text-[10px] bg-app-surface2 px-2 py-1 rounded text-app-textMuted">${ex.name} &times; ${completedSets}</span>`;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            if (!historyHTML) historyHTML = `<p class="text-app-textMuted text-sm text-center py-10">No workout history yet.</p>`;

            return `
                <div class="flex items-center gap-4 mb-8 pt-2">
                    <div class="w-16 h-16 rounded-full bg-app-surface border border-app-border flex items-center justify-center shadow-lg">
                        <i data-lucide="user" class="text-app-textMuted w-8 h-8"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-white">Athlete</h1>
                        <p class="text-sm text-app-textMuted">Ready to lift</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-app-surface border border-app-border rounded-xl p-4">
                        <p class="text-[10px] text-app-textMuted uppercase font-bold mb-1">Time Lifted</p>
                        <p class="text-xl font-black text-white">${Math.floor(totalDuration/60)}<span class="text-sm font-normal text-app-textMuted ml-1">m</span></p>
                    </div>
                    <div class="bg-app-surface border border-app-border rounded-xl p-4">
                        <p class="text-[10px] text-app-textMuted uppercase font-bold mb-1">Exercises</p>
                        <p class="text-xl font-black text-white">${totalExercises}</p>
                    </div>
                </div>

                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="history" class="w-5 h-5"></i> History</h3>
                ${historyHTML}
            `;
        }

        // --- WORKOUT TRACKER LOGIC ---
        function startWorkout() {
            state.activeWorkout = {
                startTime: Date.now(),
                duration: 0,
                exercises: []
            };
            
            // Start Timer
            state.timerInterval = setInterval(() => {
                if(state.activeWorkout) {
                    state.activeWorkout.duration = Math.floor((Date.now() - state.activeWorkout.startTime) / 1000);
                    const timerEl = document.getElementById('workout-timer');
                    if(timerEl) timerEl.innerText = formatTime(state.activeWorkout.duration);
                }
            }, 1000);

            showTracker();
        }

        function showTracker() {
            DOM.tracker.classList.remove('hidden');
            DOM.nav.style.display = 'none';
            renderTrackerBody();
        }

        function hideTracker() {
            DOM.tracker.classList.add('hidden');
            DOM.nav.style.display = 'flex';
        }

        function finishWorkout() {
            if (state.activeWorkout.exercises.length > 0) {
                state.history.push({
                    ...state.activeWorkout,
                    date: new Date().toISOString()
                });
                saveHistory();
            }
            clearInterval(state.timerInterval);
            state.activeWorkout = null;
            hideTracker();
            navigate('profile');
        }

        function cancelWorkout() {
            if(confirm('Cancel workout? No data will be saved.')) {
                clearInterval(state.timerInterval);
                state.activeWorkout = null;
                hideTracker();
                renderCurrentView(); // Refresh if on home
            }
        }

        // Tracker State Modifiers
        function addExerciseToWorkout(exerciseId) {
            const ex = EXERCISES.find(e => e.id === exerciseId);
            state.activeWorkout.exercises.push({
                instanceId: generateId(),
                ...ex,
                sets: [{ weight: '', reps: '', completed: false }]
            });
            closeModal();
            renderTrackerBody();
        }

        function addSet(instanceId) {
            const ex = state.activeWorkout.exercises.find(e => e.instanceId === instanceId);
            const lastSet = ex.sets[ex.sets.length - 1];
            ex.sets.push({ 
                weight: lastSet ? lastSet.weight : '', 
                reps: lastSet ? lastSet.reps : '', 
                completed: false 
            });
            renderTrackerBody();
        }

        function removeExercise(instanceId) {
            if(confirm('Remove this exercise?')) {
                state.activeWorkout.exercises = state.activeWorkout.exercises.filter(e => e.instanceId !== instanceId);
                renderTrackerBody();
            }
        }

        // Event Delegation for inputs and checkboxes in Tracker
        DOM.tracker.addEventListener('input', (e) => {
            if (e.target.matches('.set-input')) {
                const instanceId = e.target.dataset.ex;
                const setIdx = parseInt(e.target.dataset.set);
                const field = e.target.dataset.field;
                const ex = state.activeWorkout.exercises.find(ex => ex.instanceId === instanceId);
                if (ex) {
                    ex.sets[setIdx][field] = e.target.value;
                }
            }
        });

        DOM.tracker.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('.toggle-set');
            if (toggleBtn) {
                const instanceId = toggleBtn.dataset.ex;
                const setIdx = parseInt(toggleBtn.dataset.set);
                const ex = state.activeWorkout.exercises.find(ex => ex.instanceId === instanceId);
                if (ex) {
                    ex.sets[setIdx].completed = !ex.sets[setIdx].completed;
                    renderTrackerBody(); // Re-render to update UI colors safely
                }
            }
        });

        function renderTrackerBody() {
            let exercisesHTML = state.activeWorkout.exercises.length === 0 ? `
                <div class="text-center py-20 animate-fade-in">
                    <div class="w-20 h-20 mx-auto rounded-full bg-app-surface2 flex items-center justify-center mb-4">
                        <i data-lucide="dumbbell" class="w-8 h-8 text-app-textMuted"></i>
                    </div>
                    <h3 class="text-white font-bold text-lg mb-2">Empty Workout</h3>
                    <p class="text-app-textMuted text-sm mb-6 max-w-[250px] mx-auto">Add exercises to start tracking your progress.</p>
                </div>
            ` : state.activeWorkout.exercises.map((ex, exIndex) => `
                <div class="bg-app-surface rounded-2xl border border-app-border overflow-hidden mb-4 animate-fade-in">
                    <div class="p-4 flex items-center justify-between border-b border-app-border/50">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-app-bg border border-app-border flex items-center justify-center text-white font-bold text-sm">
                                ${exIndex + 1}
                            </div>
                            <div>
                                <h3 class="text-white font-bold text-sm">${ex.name}</h3>
                                <p class="text-xs text-app-textMuted">${ex.muscle}</p>
                            </div>
                        </div>
                        <button onclick="removeExercise('${ex.instanceId}')" class="p-2 text-app-textMuted hover:text-red-400">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-[30px_1fr_1fr_50px] gap-2 px-4 py-2 bg-app-surface2 text-[10px] font-bold text-app-textMuted uppercase tracking-wider text-center">
                        <div>Set</div>
                        <div>kg</div>
                        <div>Reps</div>
                        <div><i data-lucide="check" class="w-3 h-3 mx-auto"></i></div>
                    </div>

                    <div class="p-2 space-y-1 bg-black/30">
                        ${ex.sets.map((set, setIndex) => `
                            <div class="grid grid-cols-[30px_1fr_1fr_50px] gap-2 items-center px-2 py-1 rounded-lg ${set.completed ? 'bg-app-surface2/80' : ''}">
                                <div class="text-center text-xs font-bold ${set.completed ? 'text-app-textMuted' : 'text-app-textMuted'}">
                                    ${setIndex + 1}
                                </div>
                                <div>
                                    <input type="number" placeholder="-" value="${set.weight}" 
                                        class="set-input w-full bg-app-bg border ${set.completed ? 'border-transparent text-app-textMuted' : 'border-app-border text-white'} rounded-md text-center py-2 text-sm font-mono focus:outline-none focus:border-app-accent transition-colors"
                                        data-ex="${ex.instanceId}" data-set="${setIndex}" data-field="weight" ${set.completed ? 'disabled' : ''}>
                                </div>
                                <div>
                                    <input type="number" placeholder="-" value="${set.reps}" 
                                        class="set-input w-full bg-app-bg border ${set.completed ? 'border-transparent text-app-textMuted' : 'border-app-border text-white'} rounded-md text-center py-2 text-sm font-mono focus:outline-none focus:border-app-accent transition-colors"
                                        data-ex="${ex.instanceId}" data-set="${setIndex}" data-field="reps" ${set.completed ? 'disabled' : ''}>
                                </div>
                                <div class="flex justify-center">
                                    <button class="toggle-set w-8 h-8 rounded-md flex items-center justify-center transition-all ${set.completed ? 'bg-app-accent text-black shadow-[0_0_10px_rgba(197,255,74,0.3)]' : 'bg-app-surface2 text-app-textMuted'}"
                                        data-ex="${ex.instanceId}" data-set="${setIndex}">
                                        <i data-lucide="check" class="w-4 h-4 ${set.completed ? 'stroke-[3px]' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="p-2 bg-black/30 border-t border-app-bg/50">
                        <button onclick="addSet('${ex.instanceId}')" class="w-full py-2 rounded-lg text-sm font-bold text-app-textMuted bg-app-surface/50 hover:bg-app-surface2 transition-colors flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Set
                        </button>
                    </div>
                </div>
            `).join('');

            DOM.tracker.innerHTML = `
                <!-- Sticky Header -->
                <div class="pt-safe px-4 pb-4 bg-app-surface border-b border-app-border flex items-center justify-between sticky top-0 z-10 shadow-md">
                    <div>
                        <h2 class="text-white font-bold text-lg leading-tight">Active Workout</h2>
                        <div class="flex items-center gap-1 text-app-accent font-mono text-sm font-bold mt-0.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            <span id="workout-timer">${formatTime(state.activeWorkout ? state.activeWorkout.duration : 0)}</span>
                        </div>
                    </div>
                    <button onclick="finishWorkout()" class="bg-app-accent text-black font-bold py-2 px-6 rounded-xl text-sm shadow-[0_0_15px_rgba(197,255,74,0.2)] active:scale-95 transition-transform">
                        Finish
                    </button>
                </div>

                <!-- Scrollable Body -->
                <div class="flex-1 overflow-y-auto p-4 pb-32 hide-scrollbar bg-app-bg relative">
                    ${exercisesHTML}
                    
                    <button onclick="openExerciseModal()" class="w-full py-4 rounded-xl border-dashed border-2 border-app-border text-app-textMuted font-bold hover:border-app-accent hover:text-app-accent transition-colors flex items-center justify-center gap-2 mt-4 active:scale-95">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add Exercise
                    </button>
                    
                    <button onclick="cancelWorkout()" class="w-full mt-8 py-3 text-red-500 font-bold text-sm">
                        Cancel Session
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        // --- MODALS ---
        function openExerciseModal() {
            let exList = EXERCISES.map(ex => `
                <div onclick="addExerciseToWorkout('${ex.id}')" class="p-4 bg-app-surface2 rounded-xl flex items-center justify-between mb-2 active:scale-[0.98] transition-transform cursor-pointer border border-transparent active:border-app-accent">
                    <div>
                        <h4 class="text-white font-bold text-sm">${ex.name}</h4>
                        <p class="text-xs text-app-textMuted mt-0.5">${ex.muscle} • ${ex.equipment}</p>
                    </div>
                    <i data-lucide="plus" class="w-5 h-5 text-app-accent"></i>
                </div>
            `).join('');

            DOM.modals.innerHTML = `
                <div class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex flex-col justify-end animate-fade-in">
                    <div class="bg-app-surface h-[80vh] rounded-t-3xl border-t border-app-border flex flex-col overflow-hidden animate-slide-up mobile-container relative max-h-[100dvh]">
                        <div class="p-4 border-b border-app-border flex justify-between items-center sticky top-0 z-10 bg-app-surface">
                            <h3 class="text-white font-bold text-lg">Select Exercise</h3>
                            <button onclick="closeModal()" class="p-2 bg-app-surface2 rounded-full text-white active:scale-90 transition-transform">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="p-4 overflow-y-auto flex-1 hide-scrollbar pb-safe">
                            ${exList}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function closeModal() {
            DOM.modals.innerHTML = '';
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentView();
            updateNavUI();
        });

    </script>
</body>
</html>
